name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write        # Required to push to gh-pages
  pages: write
  id-token: write

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'  # Use your required Flutter version
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Flutter web
        run: flutter build web

      # GitHub Pages has no SPA rewrite. 404.html catches any unknown path so
      # the app can boot and route, but Pages serves it with a 404 status,
      # which stops links unfurling on WhatsApp/LinkedIn. So each real route
      # also gets its own index.html and therefore a genuine 200.
      - name: Add SPA fallback and route pages
        run: |
          cp build/web/index.html build/web/404.html
          mkdir -p build/web/phool-gobhi
          cp build/web/index.html build/web/phool-gobhi/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
